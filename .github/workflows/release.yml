name: Validate and package theme
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Package installable theme
        run: |
          VERSION=$(sed -n 's/^Version: //p' style.css)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          git archive --format=zip --prefix=storev1-theme/ -o "storev1-theme-$VERSION.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: storev1-theme
          path: storev1-theme-*.zip
